<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Miss Minutes app icon (original art, D40): a 1970s console desk clock.
       Brown moulded housing, amber-glow bezel, cream dial at 10:10, and the
       app's three-colour orange stripe. Rendered to PNG by scripts/make-icons.mjs. -->
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a412b"/>
      <stop offset="0.45" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#1f150e"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.7" stop-color="#f3e7cc"/>
      <stop offset="1" stop-color="#dcc79f"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="body"><rect x="14" y="14" width="228" height="228" rx="50"/></clipPath>
  </defs>

  <!-- Housing -->
  <rect x="14" y="14" width="228" height="228" rx="50" fill="url(#housing)"/>
  <rect x="20" y="20" width="216" height="216" rx="45" fill="none" stroke="#ffd6a0" stroke-opacity="0.16" stroke-width="3"/>

  <!-- Stripe -->
  <g clip-path="url(#body)">
    <rect x="0" y="204" width="256" height="7" fill="#ff7a1a"/>
    <rect x="0" y="211" width="256" height="7" fill="#c2410c"/>
    <rect x="0" y="218" width="256" height="7" fill="#7c2d12"/>
  </g>

  <!-- Bezel with amber glow -->
  <circle cx="128" cy="112" r="86" fill="#0b0705"/>
  <circle cx="128" cy="112" r="79" fill="none" stroke="#ff8a2a" stroke-width="6" filter="url(#glow)" opacity="0.9"/>
  <circle cx="128" cy="112" r="79" fill="none" stroke="#ffb347" stroke-width="2.5"/>

  <!-- Dial -->
  <circle cx="128" cy="112" r="72" fill="url(#dial)"/>
  <g stroke="#2a1a0d" stroke-linecap="round">
    <g stroke-width="7">
      <line x1="128" y1="48" x2="128" y2="62"/>
      <line x1="192" y1="112" x2="178" y2="112"/>
      <line x1="128" y1="176" x2="128" y2="162"/>
      <line x1="64" y1="112" x2="78" y2="112"/>
    </g>
    <g stroke-width="4">
      <line x1="128" y1="50" x2="128" y2="57" transform="rotate(30 128 112)"/>
      <line x1="128" y1="50" x2="128" y2="57" transform="rotate(60 128 112)"/>
      <line x1="128" y1="50" x2="128" y2="57" transform="rotate(120 128 112)"/>
      <line x1="128" y1="50" x2="128" y2="57" transform="rotate(150 128 112)"/>
      <line x1="128" y1="50" x2="128" y2="57" transform="rotate(210 128 112)"/>
      <line x1="128" y1="50" x2="128" y2="57" transform="rotate(240 128 112)"/>
      <line x1="128" y1="50" x2="128" y2="57" transform="rotate(300 128 112)"/>
      <line x1="128" y1="50" x2="128" y2="57" transform="rotate(330 128 112)"/>
    </g>
    <!-- Hands at 10:10 -->
    <line x1="128" y1="112" x2="128" y2="74" stroke-width="10" transform="rotate(-55 128 112)"/>
    <line x1="128" y1="120" x2="128" y2="58" stroke-width="6" stroke="#c2410c" transform="rotate(60 128 112)"/>
  </g>
  <circle cx="128" cy="112" r="7" fill="#2a1a0d"/>
  <circle cx="128" cy="112" r="2.5" fill="#ff8a2a"/>
</svg>
